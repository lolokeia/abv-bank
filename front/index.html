<!DOCTYPE html>
<html lang="ru">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<head>
    <meta charset="UTF-8">
    <title>АБВ-БАНК</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <p class="debug_msg"></p>
    <canvas id="money-bg"
            data-count="80"
            data-color="#2edd2e"
            data-bill-chance="0.2"
            data-speed="1.0"
            data-parallax="0.1"
            data-mouse-radius="130">
    </canvas>

    <script src="/js/money-bg.js"></script>
    <script src="/js/splash.js"></script>


    <div class="main">
        <h1 class="main_text">АБВ-БАНК</h1>
        <h4 class="desc">Ваши деньги в безопасности</h4>
        <b class="subdesc", id="splash"></b>
        <a href="/app" class="app_btn">Открыть Веб-версию</a>
        <a href="https://github.com/lolokeia/abv-bank" class="repo_btn">GitHub репозиторий</a>
        <script>SplashMain()</script>
    </div>

    <div class="desc">
        <section class="feature-row">
            <div class="feature-text">
                <p>Это симулятор банка для дипломной/курсовой работы! не настоящий</p>
                <h2>Наши преимущества:</h2>
                <p>Наш CEO находится в федеральном розыске</p>
                <p>Бесконечные деньги (за деньги)</p>
                <p>Open-Source</p>
                <p>Десктопное приложение</p>
                <p>API для магазинов</p>
            </div>

            <figure class="feature-image">
                <img src="/img/cat_counting_money.jpg" alt="Кот считает деньги">
                <figcaption>CEO АБВ-БАНКА</figcaption>
            </figure>
            </div>

        </section>
    </div>
    <script src="/js/footer.js"></script>
    <script src="/js/cookies.js"></script>
</body>
</html>
